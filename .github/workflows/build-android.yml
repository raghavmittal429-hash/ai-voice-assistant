name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Verify buildozer.spec exists
      run: |
        if [ ! -f buildozer.spec ]; then
          echo "ERROR: buildozer.spec not found!"
          exit 1
        fi
        echo "buildozer.spec found:"
        cat buildozer.spec

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          cmake libffi-dev libssl-dev

    - name: Install Python dependencies
      run: |
        pip install buildozer==1.5.0 cython==0.29.33

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
        echo "Build exit code: ${PIPESTATUS[0]}"
        exit ${PIPESTATUS[0]}
      timeout-minutes: 45

    - name: Locate and copy APK
      if: success()
      run: |
        echo "=== Searching for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found in project"
        
        echo "=== Creating bin directory ==="
        mkdir -p bin
        
        echo "=== Copying APK to bin/ ==="
        find . -name "*.apk" -type f -exec cp -v {} bin/ \;
        
        echo "=== Contents of bin/ ==="
        ls -la bin/

    - name: Debug on failure
      if: failure()
      run: |
        echo "=== Build failed - Debug info ==="
        echo "=== Directory structure ==="
        ls -la
        echo "=== .buildozer directory ==="
        ls -la .buildozer/ 2>/dev/null || echo ".buildozer not found"
        echo "=== Last 100 lines of build.log ==="
        tail -100 build.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ai-voice-assistant-apk
        path: output/*.apk
        retention-days: 30